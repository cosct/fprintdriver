name: ci

on:
  push:
    branches: [egis0575]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            meson ninja gobject-introspection git systemd-libs glib2-devel \
            libusb libgusb openssl pixman glib2 libgudev

      - name: Build
        run: |
          meson setup build -D introspection=false -D doc=false -D installed-tests=false -D gtk-examples=false
          meson compile -C build

      - name: Smoke-test driver registration
        run: |
          # the lister prints vid:pid entries, not driver IDs; it walks
          # every driver's id_table, so it also exercises the terminator
          ./build/libfprint/fprint-list-supported-devices | grep -i '1c7a:0575' || \
            { echo 'egis0575 driver not registered'; exit 1; }
