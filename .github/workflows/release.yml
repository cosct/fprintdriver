name: release

# Builds deb/rpm/zst packages for an egis0575-v* tag, attaches them to a
# GitHub Release, and updates the AUR package (libfprint-egis0575) via SSH.
# Finally bumps the committed packaging metadata (root PKGBUILD, rpm spec,
# AUR copy) on master so the repo's version files do not lag behind.
# Single-repo layout: packaging recipes and the libfprint/ subtree live in
# this repository; package sources point at this repo's tag tarballs.
#
# The AUR step needs the AUR_SSH_PRIVATE_KEY repo secret (dedicated key,
# public half registered in the AUR account). It skips with a warning
# while the secret is unset, and prints instructions if the key is not
# accepted by AUR yet. workflow_dispatch requires the tag to exist
# (packages are built from the tag tarball).
on:
  push:
    tags: ['egis0575-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Driver version to release (e.g. 0.2.0)'
        required: true

permissions:
  contents: read

# Serialize releases (queue, never cancel an in-flight one): two overlapping
# runs would race on the AUR git history (non-fast-forward) and on the
# GitHub Release assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Derive version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version '$INPUT_VERSION' must be X.Y.Z (digits only)"
              exit 1
            fi
            echo "VER=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VER=${GITHUB_REF_NAME#egis0575-v}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            meson ninja git systemd-libs pacman-contrib glib2-devel \
            libusb libgusb openssl pixman glib2 libgudev
      - name: Build package
        run: |
          cp packaging/aur/PKGBUILD .
          sed -i "s/^pkgver=.*/pkgver=$VER/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          useradd -m builder
          chown -R builder: .
          # the packaged sha256sums belongs to the previous tag's tarball;
          # refresh it for this tag or makepkg fails the integrity check
          sudo -u builder updpkgsums
          sudo -u builder makepkg -f --noconfirm
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: '*.pkg.tar.zst'

  build-deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Derive version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version '$INPUT_VERSION' must be X.Y.Z (digits only)"
              exit 1
            fi
            echo "VER=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VER=${GITHUB_REF_NAME#egis0575-v}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
      - name: Build package
        run: |
          # the base bookworm container has no curl; build-deb.sh installs
          # the rest of its own build deps
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
          # pin the tag tarball: build-deb.sh verifies this checksum on its
          # own download
          SHA=$(curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/egis0575-v$VER.tar.gz" | sha256sum | cut -d' ' -f1)
          test -n "$SHA"
          bash packaging/deb/build-deb.sh "$VER" "$SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: '*.deb'

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - name: Derive version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version '$INPUT_VERSION' must be X.Y.Z (digits only)"
              exit 1
            fi
            echo "VER=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VER=${GITHUB_REF_NAME#egis0575-v}" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build gcc gcc-c++ curl tar gzip \
            meson ninja-build glib2-devel libgusb-devel \
            pixman-devel libusb1-devel systemd-devel openssl-devel libgudev-devel
      - name: Build package
        run: |
          mkdir -p sources
          URL="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/egis0575-v$VER.tar.gz"
          curl -fsSL --retry 3 -o "sources/egis0575-v$VER.tar.gz" "$URL"
          # verify the tarball against an independently re-downloaded copy
          EXPECTED=$(curl -fsSL --retry 3 "$URL" | sha256sum | cut -d' ' -f1)
          echo "$EXPECTED  sources/egis0575-v$VER.tar.gz" | sha256sum -c -
          # the committed %changelog lags between releases; give the built
          # RPM an entry for the CI-driven version when it is missing
          SPEC=packaging/rpm/libfprint-egis0575.spec
          if ! grep -q -- "- $VER-1" "$SPEC"; then
            sed -i "s/^%changelog$/%changelog\\n* $(LC_ALL=C date -u '+%a %b %d %Y') cosct-ci <cosct@outlook.com> - $VER-1\\n- Built from tag egis0575-v$VER by the release workflow\\n/" "$SPEC"
          fi
          rpmbuild -bb \
            --define "version $VER" \
            --define "_sourcedir $PWD/sources" \
            --define "_rpmdir $PWD" \
            packaging/rpm/libfprint-egis0575.spec
          mv x86_64/*.rpm . 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: '*.rpm'

  release:
    needs: [build-arch, build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout first (its clean step must not wipe the downloaded
      # artifacts) — the version-sync step at the end commits to master
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Tag name
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "VER=${GITHUB_REF_NAME#egis0575-v}" >> "$GITHUB_ENV"
          else
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version '$INPUT_VERSION' must be X.Y.Z (digits only)"
              exit 1
            fi
            echo "TAG=egis0575-v$INPUT_VERSION" >> "$GITHUB_ENV"
            echo "VER=$INPUT_VERSION" >> "$GITHUB_ENV"
          fi
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # create only when missing so re-runs stay idempotent, but let a
          # genuine create failure fail the job instead of surfacing later
          # at upload time
          if ! gh release view -R "$GITHUB_REPOSITORY" "$TAG" > /dev/null 2>&1; then
            gh release create -R "$GITHUB_REPOSITORY" "$TAG" --verify-tag --generate-notes \
              --title "egis0575 driver $VER"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "$TAG" ./*.pkg.tar.zst ./*.deb ./*.rpm --clobber
      - name: Sync committed version files
        run: |
          # CI builds are version-correct via env injection; this step keeps
          # the committed copies from lagging behind releases: root PKGBUILD,
          # the rpm spec (default + changelog) and the AUR recipe copy
          # (pkgver + the real tag-tarball hash)
          git config user.name "cosct-ci"
          git config user.email "cosct@outlook.com"

          sed -i "s/^pkgver=.*/pkgver=$VER/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          SPEC=packaging/rpm/libfprint-egis0575.spec
          sed -i "s/^%define drvver .*/%define drvver %{?version}%{!?version:$VER}/" "$SPEC"
          if ! grep -q -- "- $VER-1" "$SPEC"; then
            sed -i "s/^%changelog$/%changelog\\n* $(LC_ALL=C date -u '+%a %b %d %Y') cosct-ci <cosct@outlook.com> - $VER-1\\n- Released via the release workflow (tag egis0575-v$VER).\\n/" "$SPEC"
          fi

          SHA=$(curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz" | sha256sum | cut -d' ' -f1)
          test -n "$SHA"
          sed -i "s/^pkgver=.*/pkgver=$VER/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=.*/sha256sums=('$SHA')/" packaging/aur/PKGBUILD

          if git diff --quiet; then
            echo "Committed version files already at $VER."
          else
            git add PKGBUILD packaging/rpm/libfprint-egis0575.spec packaging/aur/PKGBUILD
            git commit -m "chore: bump packaged versions to $VER [skip ci]"
            git push
            echo "Committed version bump for $VER to master."
          fi

  aur:
    needs: [release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Derive version from tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version '$INPUT_VERSION' must be X.Y.Z (digits only)"
              exit 1
            fi
            echo "VER=$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "VER=${GITHUB_REF_NAME#egis0575-v}" >> "$GITHUB_ENV"
          fi
      - name: Check AUR secret
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY secret not set; skipping AUR update. See packaging/aur/PKGBUILD header for setup."
            exit 0
          fi
          # mark the rest of the job as skipped-but-green
          echo "HAVE_KEY=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        if: env.HAVE_KEY == '1'
      - name: Update AUR package
        if: env.HAVE_KEY == '1'
        run: |
          install -m 600 /dev/null aur.key
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > aur.key
          export GIT_SSH_COMMAND="ssh -i $PWD/aur.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # openssh first: the preflight below needs the ssh binary
          # (archlinux:base-devel ships neither git nor openssh)
          pacman -Syu --noconfirm --needed openssh git \
            pacman-contrib meson ninja gobject-introspection gtk-doc glib2-devel systemd-libs \
            libusb libgusb openssl pixman glib2 libgudev

          # 'help' is a real command in AUR's restricted shell: exit 0 only
          # with valid auth (the Welcome banner only prints in no-command mode).
          ssh_out=$(ssh -i aur.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
               aur@aur.archlinux.org help 2>&1) || ssh_rc=$?
          if [ -n "${ssh_rc:-}" ]; then
            echo "ssh preflight output: $ssh_out"
            echo "::error::AUR ssh preflight failed (rc=$ssh_rc). If the output says Permission denied, the public half of AUR_SSH_PRIVATE_KEY is not registered in the AUR account (My Account -> SSH keys)."
            exit 1
          fi

          git clone ssh://aur@aur.archlinux.org/libfprint-egis0575.git aur
          # makepkg must run as non-root, so the tree is chowned to builder
          # below — tell git the directory is trusted before that flips
          # ownership and every later root git call hits the dubious-
          # ownership refusal
          git config --global --add safe.directory "$GITHUB_WORKSPACE/aur"
          cp packaging/aur/PKGBUILD aur/PKGBUILD
          cd aur
          sed -i "s/^pkgver=.*/pkgver=$VER/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          id builder 2>/dev/null || useradd -m builder
          chown -R builder: .
          # refresh the source checksum and regenerate .SRCINFO
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          if git diff --quiet; then
            echo "AUR package already at $VER; nothing to push."
          else
            git config user.name "cosct-ci"
            git config user.email "cosct@outlook.com"
            git add PKGBUILD .SRCINFO
            git commit -m "Update to $VER"
            git push origin master
            echo "AUR package updated to $VER."
          fi
